# Piaskownica oms-proba (PRZ-072) — OMS na danych demo, tylko w sieci domowej, ZERO kluczy integracji.
# Mieszka w ${K} (katalog celu, np. /srv/oms-proba), osobno od produkcji:
# inny projekt compose, inna sieć Dockera, inny katalog danych, bez .env.oms. Obsługa wyłącznie przez
# deploy/proba/proba.ps1. Zmienne celu: K (eksportuje nas-proba.sh), PROBA_IP i PROBA_UID (z ${K}/cel.env,
# które wysyła proba.ps1) — bez nich compose odmawia, nie zgaduje.
#   kod/          kod z worktree (proba.ps1 wyslij) — montowany tylko do odczytu, node --watch przeładowuje
#   dane/         oms.sqlite, proformy/, etykiety/ — skasowanie bazy + przeładowanie = świeże demo (reset)
#   konfiguracja/ proba.env (bez sekretów; OMS_PASS losowy, gaśnie po pierwszym koncie) i konto.json (hash)
name: oms-proba

services:
  oms-proba:
    image: oms-proba:zaleznosci
    build:
      context: ${K:?K ustawia nas-proba.sh}/kod
      dockerfile: deploy/proba/Dockerfile
      args:
        PROBA_UID: ${PROBA_UID:?PROBA_UID z cel.env}
    container_name: oms-proba
    restart: unless-stopped
    # Użytkownik = właściciel katalogu celu (np. 1000:1000): pułapka ACL
    # Synology nie dotyczy właściciela, a sesja może skasować bazę przy resecie bez sudo.
    user: "${PROBA_UID}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    working_dir: /app
    env_file: ${K}/konfiguracja/proba.env
    environment:
      TZ: UTC
      OMS_PORT: "3001"
      OMS_DB_PATH: /dane/oms.sqlite
      OMS_PROFORMY_KATALOG: /dane/proformy
      OMS_ETYKIETY_KATALOG: /dane/etykiety
    # --watch-path zamiast --watch: widoki .ejs i CSS nie są importowane, a też mają przeładować.
    command: ["node", "--watch-path=/app/kod/src", "--watch-path=/app/kod/scripts", "--watch-path=/app/kod/deploy/proba",
      "/app/kod/deploy/proba/start.mjs"]
    networks: [proba]
    ports:
      # Tylko LAN, tylko IPv4: adres celu w sieci lokalnej, nie 0.0.0.0.
      - "${PROBA_IP:?PROBA_IP z cel.env}:3005:3001"
    volumes:
      - ${K}/kod:/app/kod:ro
      - ${K}/dane:/dane
      - ${K}/konfiguracja:/konfiguracja:ro
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

# Stała podsieć i nazwa mostu — po nich zapora hosta może rozpoznać ruch piaskownicy (np. zero wyjścia poza odpowiedzi).
# Kontener w innej sieci (np. zbudowany ze starego compose) straż zatrzymuje.
networks:
  proba:
    name: oms-proba
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: br-oms-proba
    ipam:
      config:
        - subnet: 172.30.90.0/24
