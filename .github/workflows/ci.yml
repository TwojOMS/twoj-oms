name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sprawdz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Testy PDF czytają tekst wygenerowanych dokumentów programem pdftotext.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: npm run sprawdz -- -- --maxWorkers=2
